<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIM Project History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      padding: 2rem 1rem;
    }

    header {
      max-width: 720px;
      margin: 0 auto 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    #search {
      max-width: 720px;
      margin: 0 auto 1.5rem;
      display: block;
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
    }

    #search:focus { outline: none; border-color: #888; }

    #decisions {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      border: 1px solid #e5e5e5;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-date {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      padding-top: 2px;
    }

    .card-body {
      display: flex;
      gap: 1.25rem;
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-sidebar {
      width: 140px;
      flex-shrink: 0;
      border-left: 1px solid #f0f0f0;
      padding-left: 1.25rem;
    }

    .card-sidebar label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card-sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .card-sidebar ul li {
      font-size: 0.82rem;
      color: #3b5bdb;
    }

    .card-section {
      margin-bottom: 0.6rem;
    }

    .card-section label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      display: block;
      margin-bottom: 0.2rem;
    }

    .card-section p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #333;
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.9rem;
    }

    .tag {
      font-size: 0.75rem;
      background: #f0f0f0;
      color: #555;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
    }

    #empty {
      text-align: center;
      color: #999;
      font-size: 0.95rem;
      padding: 3rem 0;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>SIM Project History</h1>
    <p>Design decisions and rationale from stakeholder discussions.</p>
  </header>

  <input id="search" type="search" placeholder="Search decisions..." />

  <div id="decisions"></div>
  <p id="empty">No decisions match your search.</p>

  <script>
    let allDecisions = [];

    async function load() {
      const res = await fetch('decisions.json');
      allDecisions = await res.json();
      allDecisions.sort((a, b) => new Date(b.date) - new Date(a.date));
      render(allDecisions);
    }

    function render(decisions) {
      const container = document.getElementById('decisions');
      const empty = document.getElementById('empty');

      if (decisions.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      container.innerHTML = decisions.map(d => `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${esc(d.title)}</span>
            <span class="card-date">${formatDate(d.date)}</span>
          </div>
          <div class="card-body">
            <div class="card-main">
              <div class="card-section">
                <label>Decision</label>
                <p>${esc(d.decision)}</p>
              </div>
              <div class="card-section">
                <label>Rationale</label>
                <p>${esc(d.rationale)}</p>
              </div>
              ${d.alternatives ? `
              <div class="card-section">
                <label>Alternatives Considered</label>
                <p>${esc(d.alternatives)}</p>
              </div>` : ''}
            </div>
            ${(d.stakeholders || []).length ? `
            <div class="card-sidebar">
              <label>Stakeholders</label>
              <ul>
                ${(d.stakeholders || []).map(s => `<li>${esc(s)}</li>`).join('')}
              </ul>
            </div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(str) {
      return new Date(str + 'T00:00:00').toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(allDecisions.filter(d =>
        [d.title, d.decision, d.rationale, d.alternatives, ...(d.tags || []), ...(d.stakeholders || [])]
          .filter(Boolean).some(f => f.toLowerCase().includes(q))
      ));
    });

    load();
  </script>
</body>
</html>
