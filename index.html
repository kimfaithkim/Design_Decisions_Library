<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIM Project History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      padding: 2rem 1rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    #tabs {
      max-width: 960px;
      margin: 0 auto 1.25rem;
      display: flex;
      gap: 0.5rem;
    }

    .tab {
      padding: 0.4rem 1rem;
      border-radius: 99px;
      border: 1px solid #ddd;
      background: white;
      font-size: 0.875rem;
      cursor: pointer;
      color: #555;
    }

    .tab.active {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: white;
      font-weight: 500;
    }

    #search {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      display: block;
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
    }

    #search:focus { outline: none; border-color: #888; }

    #decisions {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      border: 1px solid #e5e5e5;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-date {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      padding-top: 2px;
    }

    .card-body {
      display: flex;
      gap: 1.25rem;
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-sidebar {
      width: 140px;
      flex-shrink: 0;
      border-left: 1px solid #f0f0f0;
      padding-left: 1.25rem;
    }

    .card-sidebar label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card-sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .card-sidebar ul li {
      font-size: 0.82rem;
      color: #1a1a1a;
    }

    .card-section {
      margin-bottom: 0.6rem;
    }

    .card-section label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      display: block;
      margin-bottom: 0.2rem;
    }

    .card-section p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #333;
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.9rem;
    }

    .tag {
      font-size: 0.75rem;
      background: #f0f0f0;
      color: #555;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
    }

    .card-image {
      width: 120px;
      flex-shrink: 0;
    }

    .image-frame {
      width: 120px;
      height: 260px;
      border-radius: 10px;
      border: 1.5px dashed #ddd;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.4;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .image-frame:hover { border-color: #aaa; }

    .image-frame img,
    .image-frame iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
      border: none;
      display: block;
      pointer-events: none;
    }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #lightbox.open { display: flex; }

    #lightbox-inner {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      width: min(480px, 90vw);
      height: min(1040px, 85vh);
      position: relative;
    }

    #lightbox-inner img,
    #lightbox-inner iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      pointer-events: auto;
    }

    #lightbox-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 99px;
      width: 28px;
      height: 28px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    mark {
      background: #fff176;
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    #empty {
      text-align: center;
      color: #999;
      font-size: 0.95rem;
      padding: 3rem 0;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Project Repo</h1>
  </header>

  <div id="tabs">
    <button class="tab active" data-project="All">All</button>
    <button class="tab" data-project="Scandit">Scandit</button>
    <button class="tab" data-project="Carton Audit">Carton Audit</button>
    <button class="tab" data-project="Access Hub">Access Hub</button>
  </div>

  <input id="search" type="search" placeholder="Search decisions..." />

  <div id="decisions"></div>
  <p id="empty">No decisions match your search.</p>

  <div id="lightbox">
    <div id="lightbox-inner">
      <button id="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
    </div>
  </div>

  <script>
    let allDecisions = [];
    let activeProject = 'All';

    async function load() {
      const res = await fetch('decisions.json');
      allDecisions = await res.json();
      allDecisions.sort((a, b) => new Date(b.date) - new Date(a.date));
      render(filtered());
    }

    function filtered() {
      const q = document.getElementById('search').value.toLowerCase();
      return allDecisions.filter(d => {
        const matchProject = activeProject === 'All' || d.project === activeProject;
        const matchSearch = !q || [d.title, d.decision, d.rationale, d.alternatives, ...(d.stakeholders || [])]
          .filter(Boolean).some(f => f.toLowerCase().includes(q));
        return matchProject && matchSearch;
      });
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeProject = tab.dataset.project;
      render(filtered());
    });

    function render(decisions) {
      const container = document.getElementById('decisions');
      const empty = document.getElementById('empty');

      if (decisions.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      const q = document.getElementById('search').value.toLowerCase();
      empty.style.display = 'none';
      container.innerHTML = decisions.map(d => `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${esc(d.title)}</span>
            <span class="card-date">${formatDate(d.date)}</span>
          </div>
          <div class="card-body">
            <div class="card-image">
              <div class="image-frame"
                ${d.figma ? `data-figma="${esc(d.figma)}"` : ''}
                ${d.image ? `data-image="${esc(d.image)}"` : ''}>
                ${d.figma ? `<iframe src="${esc(d.figma)}" allowfullscreen></iframe>`
                  : d.image ? `<img src="${esc(d.image)}" alt="Reference" />`
                  : `No image<br/>added yet`}
              </div>
            </div>
            <div class="card-main">
              <div class="card-section">
                <label>Decision</label>
                <p>${highlight(esc(d.decision), q)}</p>
              </div>
              <div class="card-section">
                <label>Rationale</label>
                <p>${highlight(esc(d.rationale), q)}</p>
              </div>
              ${d.alternatives ? `
              <div class="card-section">
                <label>Alternatives Considered</label>
                <p>${highlight(esc(d.alternatives), q)}</p>
              </div>` : ''}
            </div>
            ${(d.stakeholders || []).length ? `
            <div class="card-sidebar">
              <label>Stakeholders</label>
              <ul>
                ${[...(d.stakeholders || [])].sort((a, b) => a.localeCompare(b)).map(s => `<li>${highlight(esc(s), q)}</li>`).join('')}
              </ul>
            </div>` : ''}
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.image-frame[data-figma], .image-frame[data-image]').forEach(el => {
        el.addEventListener('click', () => openLightbox(el.dataset.figma || null, el.dataset.image || null));
      });
    }

    function highlight(escapedStr, q) {
      if (!q) return escapedStr;
      const escapedQ = esc(q);
      return escapedStr.replace(new RegExp(escapedQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
        m => `<mark>${m}</mark>`);
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(str) {
      return new Date(str + 'T00:00:00').toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    document.getElementById('search').addEventListener('input', () => render(filtered()));

    load();

    function openLightbox(figma, image) {
      const inner = document.getElementById('lightbox-inner');
      const btn = document.getElementById('lightbox-close');
      inner.innerHTML = '';
      inner.appendChild(btn);
      if (figma) {
        const iframe = document.createElement('iframe');
        iframe.src = figma;
        iframe.allowFullscreen = true;
        inner.appendChild(iframe);
      } else if (image) {
        const img = document.createElement('img');
        img.src = image;
        img.alt = 'Reference';
        inner.appendChild(img);
      }
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    });
  </script>
</body>
</html>
